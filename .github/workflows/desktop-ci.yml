name: Desktop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime:
    name: Windows desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        # Stop on each failed npm command, not just the last one in a block.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      # Exercise native build/launch without implicit cmd.exe cwd lookup.
      NoDefaultCurrentDirectoryInExePath: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json
            desktop/package-lock.json
      - name: Install locked dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm ci --prefix web-ui
          npm ci --prefix desktop
          npm --prefix desktop exec -- install-electron
      - name: Typecheck desktop sources
        run: npm --prefix desktop run typecheck
      - name: Check native paste probe
        run: node --test scripts/agent-lab/windows-native-paste-probe.test.mjs
      - name: Check Windows desktop sources
        run: >-
          npm --prefix desktop test --
          test/windows-portability.test.ts test/windows-pe.test.mjs test/maker-windows-zip.test.mjs
          test/desktop-target.test.mjs test/native-runtime.test.mjs test/desktop-launch-identity.test.ts
          test/native-menus.test.ts test/desktop-window.test.ts test/environment-preferences.test.ts
          test/npm-update-runner.test.ts test/environment-controller.test.ts test/release-policy.test.mjs test/launch-config.test.ts
          test/recovery-helper.test.ts test/runtime-supervisor.test.ts test/session-recovery.test.ts test/desktop-host-effects.test.ts
      - name: Check native installation boundaries
        run: >-
          npm test -- test/integration/windows-desktop-admission.integration.test.ts
          test/integration/windows-desktop-installation.integration.test.ts test/runtime/desktop-install/windows-archive.test.ts
      - name: Build and verify Windows desktop candidate
        run: |
          npm run build
          npm --prefix desktop run make -- --arch="$TARGET_ARCH"
          npm --prefix desktop run verify -- --manifest "out/artifact-manifest-win32-$TARGET_ARCH.json"
      - name: Exercise the installed Windows candidate and terminal focus with a fake provider
        run: npm run --silent agent:desktop -- smoke --app "desktop/out/Quarterdeck-win32-$TARGET_ARCH" --json
      - name: Check Windows startup recovery after unclean shutdown
        run: npm run --silent agent:desktop -- smoke --app "desktop/out/Quarterdeck-win32-$TARGET_ARCH" --session-recovery --no-agent --json
      - name: Upload synthetic Windows lab evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-lab-${{ matrix.arch }}-${{ github.run_attempt }}
          path: test-results/agent-lab/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload local Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            desktop/out/make/**/*.zip
            desktop/out/artifact-manifest-win32-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  package:
    name: Unsigned desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json
            desktop/package-lock.json
      - name: Install pinned toolchain and isolated dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm ci --prefix web-ui
          npm ci --prefix desktop
          npm --prefix desktop exec -- install-electron
      - name: Build and check desktop sources
        run: |
          npm run test:release-policy
          npm run build
          npm --prefix desktop run typecheck
          npm --prefix desktop test
      - name: Package once, then verify archives and smoke the same app in parallel
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          evidence="$PWD/test-results/agent-lab/ci-logs"
          mkdir -p "$evidence"

          run_timed() {
            local phase=$1 started=$SECONDS status=0
            shift
            {
              printf '[desktop timing] %s: start\n' "$phase"
              "$@" || status=$?
              printf '[desktop timing] %s: exit %d (%ds)\n' "$phase" "$status" "$((SECONDS - started))"
              return "$status"
            } 2>&1 | tee "$evidence/$phase.log"
          }

          make_archives() (
            # Match desktop-command.mjs, without its build/stage/package work.
            cd desktop || exit
            export QUARTERDECK_DESKTOP_ARCH="$TARGET_ARCH"
            export QUARTERDECK_DESKTOP_RUNTIME_PATH="$PWD/.stage/$TARGET_ARCH/runtime"
            "$QUARTERDECK_DESKTOP_RUNTIME_PATH/bin/node" node_modules/@electron-forge/cli/dist/electron-forge.js \
              make --from-package --platform=darwin --arch="$TARGET_ARCH"
          )

          run_timed package npm --prefix desktop run package -- --arch="$TARGET_ARCH"
          parallel_started=$SECONDS
          (
            run_timed make make_archives &&
              run_timed verify npm --prefix desktop run verify -- --manifest "$PWD/desktop/out/artifact-manifest-darwin-$TARGET_ARCH.json"
          ) &
          archives_pid=$!
          run_timed smoke npm run --silent agent:desktop -- smoke --app "desktop/out/Quarterdeck-darwin-$TARGET_ARCH/Quarterdeck.app" --json &
          smoke_pid=$!

          # Wait for both even if one fails, so the other can finish and retain its evidence.
          archives_status=0 smoke_status=0
          wait "$archives_pid" || archives_status=$?
          wait "$smoke_pid" || smoke_status=$?
          printf '[desktop timing] parallel: archives exit %d, smoke exit %d (%ds)\n' \
            "$archives_status" "$smoke_status" "$((SECONDS - parallel_started))" | tee "$evidence/parallel.log"
          (( archives_status == 0 && smoke_status == 0 ))
      - name: Upload synthetic desktop lab evidence and packaging logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-lab-${{ matrix.arch }}-${{ github.run_attempt }}
          path: test-results/agent-lab/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload install containers and identity manifest
        uses: actions/upload-artifact@v7
        with:
          name: desktop-unsigned-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            desktop/out/make/**/*.dmg
            desktop/out/make/**/*.zip
            desktop/out/artifact-manifest-darwin-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
