name: Desktop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-runtime:
    name: Windows desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json
            desktop/package-lock.json
      - name: Install locked dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm ci --prefix web-ui
          npm ci --prefix desktop
          npm --prefix desktop exec -- install-electron
      - name: Check Windows desktop boundaries
        run: |
          npm --prefix desktop run typecheck
          npm --prefix desktop test -- test/windows-portability.test.ts test/windows-pe.test.mjs test/desktop-target.test.mjs test/native-runtime.test.mjs test/desktop-launch-identity.test.ts test/native-menus.test.ts test/desktop-window.test.ts test/environment-preferences.test.ts
          npm --prefix desktop test -- test/npm-update-runner.test.ts test/environment-controller.test.ts test/release-policy.test.mjs test/launch-config.test.ts
          npm test -- test/integration/windows-desktop-admission.integration.test.ts test/integration/windows-desktop-installation.integration.test.ts test/runtime/desktop-install/windows-archive.test.ts
      - name: Build and verify Windows desktop candidate
        run: |
          npm run build
          npm --prefix desktop run make -- --arch=$env:TARGET_ARCH
          npm --prefix desktop run verify -- --manifest "out/artifact-manifest-win32-$env:TARGET_ARCH.json"
          npm run --silent agent:desktop -- smoke --app "$PWD/desktop/out/Quarterdeck-win32-$env:TARGET_ARCH" --json
      - name: Upload local Windows candidate
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            desktop/out/make/**/*.zip
            desktop/out/artifact-manifest-win32-${{ matrix.arch }}.json
            test-results/agent-lab/
          if-no-files-found: error
          retention-days: 7
  package:
    name: Unsigned desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json
            desktop/package-lock.json
      - name: Install pinned toolchain and isolated dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm ci --prefix web-ui
          npm ci --prefix desktop
          npm --prefix desktop exec -- install-electron
      - name: Build and check desktop sources
        run: |
          npm run test:release-policy
          npm run build
          npm --prefix desktop run typecheck
          npm --prefix desktop test
      - name: Make and verify native desktop artifact
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          npm --prefix desktop run make -- --arch="$TARGET_ARCH"
          npm --prefix desktop run verify -- --manifest "$PWD/desktop/out/artifact-manifest-darwin-$TARGET_ARCH.json"
      - name: Exercise isolated packaged app with a fake provider
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: npm run agent:desktop -- smoke --app "desktop/out/Quarterdeck-darwin-$TARGET_ARCH/Quarterdeck.app" --json
      - name: Upload synthetic desktop lab evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-lab-${{ matrix.arch }}-${{ github.run_attempt }}
          path: test-results/agent-lab/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload install containers and identity manifest
        uses: actions/upload-artifact@v7
        with:
          name: desktop-unsigned-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            desktop/out/make/**/*.dmg
            desktop/out/make/**/*.zip
            desktop/out/artifact-manifest-darwin-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
