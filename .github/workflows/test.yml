name: Test

on:
  workflow_call:
    inputs:
      focused_windows:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      focused_windows:
        description: Run only the native Windows smoke for fast iteration
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-check-test:
    if: ${{ !inputs.focused_windows }}
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.22.3
          - os: ubuntu-latest
            node-version: 24.15.0
          - os: macos-latest
            node-version: 22.22.3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Build
        run: npm run build

      - name: Check (agent instructions, lint, typecheck, root tests)
        run: npm run check

      - name: Web UI tests
        run: npm run web:test

  windows-native:
    name: Windows native
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        if: ${{ !inputs.focused_windows }}
        run: npm ci --prefix web-ui

      - name: Build
        if: ${{ !inputs.focused_windows }}
        run: npm run build

      - name: Packaged CLI launch smoke
        if: ${{ !inputs.focused_windows }}
        run: node scripts/windows-packaged-cli-smoke.mjs

      - name: Focused native Windows smoke
        if: ${{ inputs.focused_windows }}
        run: npx vitest run test/integration/windows-native-smoke.integration.test.ts

      - name: Check (includes native Windows smoke)
        if: ${{ !inputs.focused_windows }}
        run: npm run check

      - name: Web UI tests
        if: ${{ !inputs.focused_windows }}
        run: npm run web:test
