name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to test; empty uses the triggering ref
        type: string
        default: ""
      focused_windows:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      focused_windows:
        description: Run only the native Windows smoke for fast iteration
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-check-test:
    if: ${{ !inputs.focused_windows }}
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.23.2
          - os: ubuntu-latest
            node-version: 24.21.0
          - os: macos-latest
            node-version: 22.23.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Build
        run: npm run build

      - name: Install managed Chromium
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.2' }}
        run: npm --prefix web-ui exec -- playwright install --with-deps chromium

      - name: Production browser startup smoke
        id: production-browser-smoke
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '22.23.2' }}
        run: npm run web:smoke:production

      - name: Upload production browser smoke failure evidence
        if: ${{ failure() && steps.production-browser-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-smoke-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

      - name: Published package artifact smoke
        run: npm run test:package -- --npm-cache "$(npm config get cache)"

      - name: Check (agent instructions, lint, typecheck, root tests)
        run: npm run check

      - name: Web UI tests
        run: npm run web:test

  windows-native:
    name: Windows native
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        if: ${{ !inputs.focused_windows }}
        run: npm ci --prefix web-ui

      - name: Build
        if: ${{ !inputs.focused_windows }}
        run: npm run build

      - name: Published package artifact smoke
        if: ${{ !inputs.focused_windows }}
        run: npm run test:package -- --npm-cache "$(npm config get cache)"

      - name: Focused native Windows smoke
        if: ${{ inputs.focused_windows }}
        run: npx vitest run test/integration/windows-native-smoke.integration.test.ts

      - name: Check (includes native Windows smoke)
        if: ${{ !inputs.focused_windows }}
        run: npm run check

      - name: Web UI tests
        if: ${{ !inputs.focused_windows }}
        run: npm run web:test
