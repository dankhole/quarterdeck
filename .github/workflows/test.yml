name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check-test:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.22.2
          - os: ubuntu-latest
            node-version: 24.15.0
          - os: macos-latest
            node-version: 22.22.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Build
        run: npm run build

      - name: Check (agent instructions, lint, typecheck, root tests)
        run: npm run check

      - name: Web UI tests
        run: npm run web:test

  windows-native:
    name: Windows native
    timeout-minutes: 25
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Build
        run: npm run build

      - name: Packaged CLI launch smoke
        run: node scripts/windows-packaged-cli-smoke.mjs

      - name: Check (includes native Windows smoke)
        run: npm run check

      - name: Web UI tests
        run: npm run web:test
