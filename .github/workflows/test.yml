name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to test; empty uses the triggering ref
        type: string
        default: ""
      focused_windows:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      focused_windows:
        description: Run only the native Windows smoke for fast iteration
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-check-test:
    if: ${{ !inputs.focused_windows }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 10 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22.23.2
          - os: ubuntu-latest
            node-version: 24.21.0
          - os: macos-latest
            node-version: 22.23.2
          # Windows source checks run in parallel in windows-native below.
          - os: windows-latest
            node-version: 22.23.2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Build
        run: npm run build

      - name: Published package artifact smoke
        shell: bash
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.ref }}
        run: |
          release_args=()
          if [[ -n "$RELEASE_SOURCE_SHA" ]]; then release_args=(--release-source-sha "$RELEASE_SOURCE_SHA"); fi
          npm run test:package -- --npm-cache "$(npm config get cache)" "${release_args[@]}"

      - name: Check (agent instructions, lint, typecheck, root tests)
        if: ${{ runner.os != 'Windows' }}
        run: npm run check

      - name: Web UI tests
        run: npm run web:test

  windows-native:
    name: ${{ inputs.focused_windows && 'Windows native' || format('Windows native ({0})', matrix.shard) }}
    timeout-minutes: 25
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.focused_windows && '["smoke"]' || '["1/3", "2/3", "3/3"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Focused native Windows smoke
        if: ${{ inputs.focused_windows }}
        run: npx vitest run test/integration/windows-native-smoke.integration.test.ts

      # Run the non-Vitest portion of npm run check once across the Windows shards.
      - name: Static checks and release policy
        if: ${{ !inputs.focused_windows && strategy.job-index == 0 }}
        shell: bash
        run: |
          npm run check:agent-instructions
          npx @biomejs/biome check .
          npm run typecheck
          npm run test:release-policy

      - name: Root tests in integration mode
        if: ${{ !inputs.focused_windows }}
        # Git Bash sets the process token's default owner to the current user.
        # Match Desktop CI so admission fixtures don't inherit Administrators ownership.
        shell: bash
        env:
          VITEST_SHARD: ${{ matrix.shard }}
        run: npm run test -- --mode integration --shard "$VITEST_SHARD"
