name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (example: v1.2.3)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      sha: ${{ steps.resolve_tag.outputs.sha }}
      desktop_public: ${{ steps.desktop_state.outputs.public }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve_tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Error: tag must match vX.Y.Z (with optional prerelease suffix)"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Error: tag '$TAG' does not exist"
            exit 1
          fi
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Inspect immutable public desktop release before rebuilding
        id: desktop_state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve_tag.outputs.tag }}
          SOURCE_SHA: ${{ steps.resolve_tag.outputs.sha }}
        run: |
          node .github/scripts/desktop-publication.mjs inspect --repository "$GITHUB_REPOSITORY" --version "${TAG#v}" --sha "$SOURCE_SHA"
      - name: Reject an npm version already published from different source
        env:
          TAG: ${{ steps.resolve_tag.outputs.tag }}
          SOURCE_SHA: ${{ steps.resolve_tag.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { getNpmPublicationState } from './.github/scripts/npm-publication-identity.mjs';
          getNpmPublicationState({version: process.env.TAG.slice(1), sourceSha: process.env.SOURCE_SHA});
          NODE

  test:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  desktop:
    needs: [resolve, test]
    if: ${{ needs.resolve.outputs.desktop_public != 'true' }}
    uses: ./.github/workflows/desktop-release.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
    secrets: inherit

  desktop-assets:
    name: Publish and anonymously verify complete desktop assets
    needs: [resolve, test, desktop]
    if: ${{ always() && needs.resolve.result == 'success' && needs.test.result == 'success' && (needs.desktop.result == 'success' || (needs.resolve.outputs.desktop_public == 'true' && needs.desktop.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        if: ${{ needs.resolve.outputs.desktop_public != 'true' }}
        with:
          pattern: desktop-signed-*
          path: desktop-release-assets
          merge-multiple: true
      - name: Extract changelog entry
        id: changelog
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: node .github/scripts/extract-changelog-entry.mjs --version "${TAG#v}" --changelog CHANGELOG.md --output-key body
      - name: Write release notes
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.body }}
        run: node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("desktop-release-notes.txt", process.env.RELEASE_NOTES + "\n")'
      - name: Publish fresh assets or reuse immutable public bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          desktop_version=$(node -p "require('./desktop/package.json').version")
          [[ "$TAG" == "v$version" && "$version" == "$desktop_version" ]] || { echo "Product tag/version mismatch"; exit 1; }
          node .github/scripts/desktop-publication.mjs publish --repository "$GITHUB_REPOSITORY" --version "$version" --sha "$SOURCE_SHA" --dir desktop-release-assets --public-dir desktop-public-verification --notes desktop-release-notes.txt

  publish:
    name: Publish npm after public desktop availability
    needs: [resolve, test, desktop-assets]
    if: ${{ always() && needs.resolve.result == 'success' && needs.test.result == 'success' && needs.desktop-assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/quarterdeck
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Match the required release-test lane. Node 22.22.2's bundled npm can
          # corrupt its own module tree while upgrading to the pinned npm.
          node-version: "22.23.2"
          registry-url: "https://registry.npmjs.org"

      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Verify trusted publishing toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Verify tag matches package version
        id: version
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: tag '$TAG' does not match package version '$EXPECTED_TAG'"
            exit 1
          fi

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, validate, and publish to npm (OIDC trusted publishing)
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.package_version }}
          RELEASE_SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { getNpmPublicationState } from './.github/scripts/npm-publication-identity.mjs';
          const version = process.env.RELEASE_VERSION;
          const sourceSha = process.env.RELEASE_SOURCE_SHA;
          if (getNpmPublicationState({ version, sourceSha }) === 'published') {
            console.log(`npm already contains ${version} from the release source; immutable release retry complete.`);
          } else {
            const publish = spawnSync('npm', ['publish', '--access', 'public', '--tag', version.includes('-') ? 'preview' : 'latest'], { stdio: 'inherit' });
            if (publish.error) throw publish.error;
            if (publish.status !== 0) process.exit(publish.status ?? 1);
            if (getNpmPublicationState({ version, sourceSha }) !== 'published') {
              throw new Error('npm publication identity is not yet confirmed; retry this immutable release.');
            }
          }
          NODE
