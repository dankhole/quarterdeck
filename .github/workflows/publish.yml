name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (example: v1.2.3)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve_tag.outputs.tag }}
      sha: ${{ steps.resolve_tag.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve tag
        id: resolve_tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Error: tag must match vX.Y.Z (with optional prerelease suffix)"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Error: tag '$TAG' does not exist"
            exit 1
          fi
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish npm package and create GitHub release
    needs: [resolve, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/quarterdeck
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Match the required release-test lane. Node 22.22.2's bundled npm can
          # corrupt its own module tree while upgrading to the pinned npm.
          node-version: "22.23.2"
          registry-url: "https://registry.npmjs.org"

      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Verify trusted publishing toolchain
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Verify tag matches package version
        id: version
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Error: tag '$TAG' does not match package version '$EXPECTED_TAG'"
            exit 1
          fi

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog entry for release
        id: changelog
        run: |
          node .github/scripts/extract-changelog-entry.mjs \
            --version "${{ steps.version.outputs.package_version }}" \
            --changelog CHANGELOG.md \
            --output-key body

      - name: Build, validate, and publish to npm (OIDC trusted publishing)
        run: npm publish --access public

      - name: Compute compare link
        id: compare
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)

          if [ -n "$PREV_TAG" ]; then
            echo "link=Full Changelog: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "link=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ${{ steps.compare.outputs.link }}
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
