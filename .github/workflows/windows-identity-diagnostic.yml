name: Windows module diagnostic
on:
  push:
    branches: [ci/windows-identity-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Probe isolated system modules
        shell: pwsh
        run: |
          @'
          const {execFileSync}=require('node:child_process');
          const {mkdtempSync,mkdirSync,rmSync}=require('node:fs');
          const {join}=require('node:path');
          const root=mkdtempSync(join(require('node:os').tmpdir(),'qd-module-diagnostic-'));
          const home=join(root,'home');mkdirSync(home);
          const get=k=>Object.entries(process.env).find(([n])=>n.toLowerCase()===k.toLowerCase())?.[1];
          const base=Object.fromEntries(['PATH','SystemRoot','WINDIR','ComSpec','PATHEXT'].flatMap(k=>get(k)?[[k,get(k)]]:[]));
          Object.assign(base,{HOME:home,USERPROFILE:home,TEMP:root,TMP:root,TMPDIR:root,NO_COLOR:'1',LC_ALL:'C'});
          const psHome=join(get('SystemRoot'),'System32','WindowsPowerShell','v1.0');
          const exe=join(psHome,'powershell.exe');
          const scripts={
            boot:[
              "$ErrorActionPreference = 'Stop'",
              "$source = @'",
              'using System;',
              'using System.Runtime.InteropServices;',
              'public static class QuarterdeckBootIdentity {',
              '  [DllImport("ntdll.dll")] private static extern int NtQuerySystemInformation(int infoClass, IntPtr buffer, int length, out int returned);',
              '  public static string Read() {',
              '    IntPtr buffer = Marshal.AllocHGlobal(64);',
              '    try {',
              '      int returned;',
              '      int status = NtQuerySystemInformation(90, buffer, 64, out returned);',
              '      if (status != 0 || returned < 16 || returned > 64) throw new InvalidOperationException("Boot identity unavailable");',
              '      Guid identity = (Guid)Marshal.PtrToStructure(buffer, typeof(Guid));',
              '      if (identity == Guid.Empty) throw new InvalidOperationException("Empty boot identity");',
              '      return identity.ToString("D");',
              '    } finally { Marshal.FreeHGlobal(buffer); }',
              '  }',
              '}',
              "'@",
              'Add-Type -TypeDefinition $source',
              "$identity = [QuarterdeckBootIdentity]::Read()",
              "[Console]::WriteLine([bool]($identity -match '^[a-fA-F0-9]{8}(?:-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$'))"
            ].join('\n'),
            process:[
              "$ErrorActionPreference = 'Stop'",
              "$serializedPids = '[' + $PID + ']'",
              "$requestedPids = if ([string]::IsNullOrWhiteSpace($serializedPids)) { @() } else { @(ConvertFrom-Json -InputObject $serializedPids) }",
              '$requested = @{}',
              'foreach ($requestedPid in $requestedPids) { $requested[[int]$requestedPid] = $true }',
              "$filter = (($requested.Keys | ForEach-Object { 'ProcessId = ' + [int]$_ }) -join ' OR ')",
              '$rows = @(Get-CimInstance Win32_Process -Filter $filter)',
              '$valid = $rows.Count -eq 1 -and [int]$rows[0].ProcessId -eq $PID -and $null -ne $rows[0].CreationDate',
              'ConvertTo-Json -InputObject ([pscustomobject]@{count = $rows.Count; valid = [bool]$valid}) -Compress'
            ].join('; ')
          };
          try {
            for(const [label,env] of [['explicit-system-imports',base],['inherited-module-path',{...base,PSModulePath:get('PSModulePath')}]]) {
              for(const [probe,script] of Object.entries(scripts)) {
                const start=Date.now();
                try {
                  const modules=probe==='boot'?['Microsoft.PowerShell.Utility']:['Microsoft.PowerShell.Utility','CimCmdlets'];
                  const imports=label==='explicit-system-imports'?modules.map(name=>"Import-Module ([IO.Path]::Combine($PSHOME,'Modules','"+name+"','"+name+".psd1')) -ErrorAction Stop").join('; ')+';\n':'';
                  const out=execFileSync(exe,['-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-EncodedCommand',Buffer.from(imports+script,'utf16le').toString('base64')],{env,encoding:'utf8',timeout:20000,windowsHide:true,stdio:['ignore','pipe','pipe']});
                  const result=probe==='boot'?{valid:out.trim().toLowerCase()==='true'}:JSON.parse(out);
                  console.log(JSON.stringify({label,probe,elapsed:Date.now()-start,valid:result.valid===true,...(probe==='process'?{count:result.count}:{} )}));
                } catch(e) {
                  console.log(JSON.stringify({label,probe,elapsed:Date.now()-start,status:e.status??null,signal:e.signal??null,code:e.code??null}));
                }
              }
            }
          } finally {rmSync(root,{recursive:true,force:true,maxRetries:15,retryDelay:100});}
          '@ | Set-Content diagnostic.cjs
          node diagnostic.cjs
