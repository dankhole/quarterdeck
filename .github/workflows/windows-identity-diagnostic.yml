name: Focused Windows CI repair
on:
  push:
    branches: [ci/windows-identity-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Verify affected native scenarios
        run: npx vitest run --mode integration test/integration/agent-desktop-session-recovery-fixture.integration.test.ts test/integration/project-discovery.integration.test.ts test/integration/windows-native-smoke.integration.test.ts
