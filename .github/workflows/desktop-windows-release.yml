name: Desktop public Windows candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit SHA to build (does not publish)
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact reviewed source
        id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$GITHUB_REPOSITORY" == dankhole/quarterdeck ]] || exit 1
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || exit 1
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git fetch origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
  windows:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      TARGET_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Install locked dependencies and validate native installation
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm ci --prefix web-ui
          npm ci --prefix desktop
          npm --prefix desktop exec -- install-electron
          npm run typecheck
          npm --prefix desktop run typecheck
          npm test -- test/integration/windows-desktop-admission.integration.test.ts test/integration/windows-desktop-installation.integration.test.ts
          npm run build
      - name: Verify packaged Windows lifecycle in an isolated profile
        run: |
          npm --prefix desktop run package -- --arch=$env:TARGET_ARCH
          npm run --silent agent:desktop -- smoke --app "$PWD/desktop/out/Quarterdeck-win32-$env:TARGET_ARCH" --json
      - name: Build public Windows ZIP
        env:
          QUARTERDECK_DESKTOP_DISTRIBUTION: windows-unsigned
        run: |
          npm --prefix desktop run make -- --arch=$env:TARGET_ARCH
          npm --prefix desktop run verify -- --manifest "out/artifact-manifest-win32-$env:TARGET_ARCH.json"
          $version = node -p "require('./package.json').version"
          $payload = 'desktop/out/release'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          $zip = @(Get-ChildItem -LiteralPath desktop/out/make -Recurse -File -Filter '*.zip')
          if ($zip.Count -ne 1) { throw 'Expected exactly one Windows ZIP' }
          Copy-Item -LiteralPath $zip[0].FullName -Destination "$payload/Quarterdeck-$version-win32-$env:TARGET_ARCH.zip"
          node .github/scripts/desktop-release-artifacts.mjs finalize --dir $payload --arch $env:TARGET_ARCH --sha $env:SOURCE_SHA --distribution windows-unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-${{ matrix.arch }}
          overwrite: true
          path: desktop/out/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
