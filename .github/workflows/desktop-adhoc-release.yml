name: Desktop public ad-hoc candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main commit SHA to build (does not publish)
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact reviewed Quarterdeck commit on main
        id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$GITHUB_REPOSITORY" == dankhole/quarterdeck ]] || { echo "Quarterdeck repository required"; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "Run the reviewed main workflow or an immutable version tag"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact commit SHA required"; exit 1; }
          git fetch origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  adhoc:
    name: Public ad-hoc desktop (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Install pinned toolchain and isolated dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm ci --prefix web-ui
          npm ci --prefix desktop
          npm --prefix desktop exec -- install-electron
          npm run test:release-policy
          npm run build
          npm --prefix desktop run typecheck
          npm --prefix desktop test
      - name: Build and verify public ad-hoc application
        env:
          QUARTERDECK_DESKTOP_DISTRIBUTION: ad-hoc
        run: |
          npm --prefix desktop run make -- --arch="$TARGET_ARCH"
          app="desktop/out/Quarterdeck-darwin-$TARGET_ARCH/Quarterdeck.app"
          npm --prefix desktop run verify -- --manifest "$PWD/desktop/out/artifact-manifest-darwin-$TARGET_ARCH.json"
          codesign --verify --deep --strict "$app"
          # No Developer ID identity, Apple submission, staple, or Gatekeeper bypass.
          version=$(node -p "require('./package.json').version")
          payload=desktop/out/release
          mkdir -p "$payload"
          dmg=$(find desktop/out/make -name '*.dmg' -type f)
          [[ -n "$dmg" && "$dmg" != *$'\n'* ]] || { echo "Expected exactly one DMG"; exit 1; }
          cp "$dmg" "$payload/Quarterdeck-$version-darwin-$TARGET_ARCH.dmg"
          hdiutil verify "$payload/Quarterdeck-$version-darwin-$TARGET_ARCH.dmg"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$payload/Quarterdeck-$version-darwin-$TARGET_ARCH.zip"
          node .github/scripts/desktop-release-artifacts.mjs finalize --dir "$payload" --arch "$TARGET_ARCH" --sha "$SOURCE_SHA" --distribution ad-hoc
      - name: Upload verified public ad-hoc candidate (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: desktop-adhoc-${{ matrix.arch }}
          overwrite: true
          path: desktop/out/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
