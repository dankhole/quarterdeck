name: Desktop signed candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main commit SHA to build (does not publish)
        required: true
        type: string
      validation_feed_base:
        description: Optional signed HTTPS validation feed base (candidate only; never public release)
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      production_updates:
        required: false
        default: false
        type: boolean
      coordinated_release:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require an exact commit on main
        id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact commit SHA required"; exit 1; }
          git fetch origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  signed:
    name: Signed desktop (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: desktop-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      QUARTERDECK_DESKTOP_NOTARY_PROFILE: quarterdeck-notary
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Select temporary signing keychain
        run: echo "QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN=$RUNNER_TEMP/quarterdeck-signing.keychain-db" >> "$GITHUB_ENV"
      - name: Install pinned toolchain and isolated dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm ci --prefix web-ui
          npm ci --prefix desktop
          npm --prefix desktop exec -- install-electron
          npm run test:release-policy
          npm run build
          npm --prefix desktop run typecheck
          npm --prefix desktop test
      - name: Prepare temporary signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.DESKTOP_MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_MAC_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.DESKTOP_MAC_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ vars.DESKTOP_MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.DESKTOP_MAC_NOTARY_ISSUER }}
        run: |
          : "${CERTIFICATE_BASE64:?Missing signing certificate}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${NOTARY_KEY_BASE64:?Missing notarization key}"
          : "${NOTARY_KEY_ID:?Missing notarization key ID}"
          : "${NOTARY_ISSUER:?Missing notarization issuer}"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const [name, variable] of [['quarterdeck-certificate.p12', 'CERTIFICATE_BASE64'], ['quarterdeck-notary.p8', 'NOTARY_KEY_BASE64']]) {
            writeFileSync(join(process.env.RUNNER_TEMP, name), Buffer.from(process.env[variable], 'base64'), { mode: 0o600 });
          }
          NODE
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/quarterdeck-certificate.p12" -k "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"
          xcrun notarytool store-credentials "$QUARTERDECK_DESKTOP_NOTARY_PROFILE" --keychain "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" --key "$RUNNER_TEMP/quarterdeck-notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
      - name: Sign and notarize application
        env:
          QUARTERDECK_DESKTOP_SIGN: "1"
          QUARTERDECK_DESKTOP_NOTARIZE: "1"
          QUARTERDECK_DESKTOP_SIGNING_IDENTITY: ${{ vars.DESKTOP_MAC_SIGNING_IDENTITY }}
          QUARTERDECK_DESKTOP_TEAM_ID: ${{ vars.DESKTOP_MAC_TEAM_ID }}
          QUARTERDECK_DESKTOP_PRODUCTION_UPDATES: ${{ vars.QUARTERDECK_DESKTOP_PRODUCTION_UPDATES }}
          QUARTERDECK_DESKTOP_VALIDATION_FEED_BASE: ${{ !inputs.coordinated_release && inputs.validation_feed_base || '' }}
          COORDINATED_PRODUCTION_UPDATES: ${{ inputs.production_updates && '1' || '' }}
          COORDINATED_RELEASE: ${{ inputs.coordinated_release && '1' || '' }}
        run: |
          : "${QUARTERDECK_DESKTOP_SIGNING_IDENTITY:?Missing Developer ID Application identity}"
          # Reusable public builds derive policy from immutable product version; manual validation never uses production.
          if [[ -n "$COORDINATED_PRODUCTION_UPDATES" ]]; then export QUARTERDECK_DESKTOP_PRODUCTION_UPDATES=1; fi
          if [[ -n "$QUARTERDECK_DESKTOP_VALIDATION_FEED_BASE" ]]; then unset QUARTERDECK_DESKTOP_PRODUCTION_UPDATES; fi
          if [[ -n "$COORDINATED_RELEASE" && -z "$COORDINATED_PRODUCTION_UPDATES" ]]; then unset QUARTERDECK_DESKTOP_PRODUCTION_UPDATES; fi
          npm --prefix desktop run make -- --arch="$TARGET_ARCH"
          app="desktop/out/Quarterdeck-darwin-$TARGET_ARCH/Quarterdeck.app"
          npm --prefix desktop run verify -- --manifest "$PWD/desktop/out/artifact-manifest-darwin-$TARGET_ARCH.json"
          codesign --verify --deep --strict "$app"
          # Extra resources are executable code too; verify each helper/addon.
          while IFS= read -r -d '' executable; do
            description=$(file -b "$executable")
            if [[ "$description" == *Mach-O* ]]; then codesign --verify --strict "$executable"; fi
          done < <(find "$app/Contents/Resources/runtime" -type f -print0)
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Finalize notarized install and update containers
        env:
          SIGNING_IDENTITY: ${{ vars.DESKTOP_MAC_SIGNING_IDENTITY }}
        run: |
          version=$(node -p "require('./package.json').version")
          app="desktop/out/Quarterdeck-darwin-$TARGET_ARCH/Quarterdeck.app"
          payload=desktop/out/release
          mkdir -p "$payload"
          # Forge's DMG name is intentionally independent of updater matching.
          dmg=$(find desktop/out/make -name '*.dmg' -type f)
          [[ -n "$dmg" && "$dmg" != *$'\n'* ]] || { echo "Expected exactly one DMG"; exit 1; }
          final_dmg="$payload/Quarterdeck-$version-darwin-$TARGET_ARCH.dmg"
          cp "$dmg" "$final_dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" --keychain "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" "$final_dmg"
          xcrun notarytool submit "$final_dmg" --keychain "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" --keychain-profile "$QUARTERDECK_DESKTOP_NOTARY_PROFILE" --wait --output-format json > "$RUNNER_TEMP/quarterdeck-dmg-notary.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'quarterdeck-dmg-notary.json'), 'utf8'));
          if (result.status !== 'Accepted') throw new Error(`DMG notarization rejected: ${result.status}`);
          NODE
          xcrun stapler staple "$final_dmg"
          xcrun stapler validate "$final_dmg"
          codesign --verify --strict "$final_dmg"
          hdiutil verify "$final_dmg"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$payload/Quarterdeck-$version-darwin-$TARGET_ARCH.zip"
          node .github/scripts/desktop-release-artifacts.mjs finalize --dir "$payload" --arch "$TARGET_ARCH" --sha "$SOURCE_SHA"
      - name: Remove signing materials
        if: always()
        run: |
          if [[ -f "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" ]]; then security delete-keychain "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/quarterdeck-certificate.p12" "$RUNNER_TEMP/quarterdeck-notary.p8"
      - name: Upload verified signed candidate (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: desktop-signed-${{ matrix.arch }}-${{ github.run_attempt }}
          path: desktop/out/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
