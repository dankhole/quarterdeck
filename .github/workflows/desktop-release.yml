name: Desktop signed candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main commit SHA to build (does not publish)
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an exact commit on main
        id: check
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          # source_sha alone does not authorize a workflow from an arbitrary ref.
          [[ "$GITHUB_REPOSITORY" == dankhole/quarterdeck ]] || { echo "Quarterdeck repository required"; exit 1; }
          [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "Run the reviewed main workflow or an immutable version tag"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "Exact commit SHA required"; exit 1; }
          git fetch origin main
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  signed:
    name: Signed desktop (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: desktop-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      QUARTERDECK_DESKTOP_NOTARY_PROFILE: quarterdeck-notary
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Select isolated temporary signing directory
        run: |
          signing_dir=$(mktemp -d "$RUNNER_TEMP/quarterdeck-signing.XXXXXX")
          chmod 700 "$signing_dir"
          echo "QUARTERDECK_DESKTOP_SIGNING_DIR=$signing_dir" >> "$GITHUB_ENV"
          echo "QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN=$signing_dir/signing.keychain-db" >> "$GITHUB_ENV"
      - name: Validate public signing configuration before building
        env:
          SIGNING_IDENTITY: ${{ vars.DESKTOP_MAC_SIGNING_IDENTITY }}
          TEAM_ID: ${{ vars.DESKTOP_MAC_TEAM_ID }}
          NOTARY_KEY_ID: ${{ vars.DESKTOP_MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.DESKTOP_MAC_NOTARY_ISSUER }}
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          if (!/^Developer ID Application: .+ \([A-Z0-9]{10}\)$/.test(env.SIGNING_IDENTITY ?? '') ||
              !/^[A-Z0-9]{10}$/.test(env.TEAM_ID ?? '') || !env.SIGNING_IDENTITY.endsWith(`(${env.TEAM_ID})`) ||
              !/^[A-Z0-9]{10}$/.test(env.NOTARY_KEY_ID ?? '') ||
              !/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(env.NOTARY_ISSUER ?? '')) {
            throw new Error('Missing or malformed signing identity/team or team notarization API identifiers; values are not logged.');
          }
          NODE
      - name: Install pinned toolchain and isolated dependencies
        run: |
          npm install --global npm@11.19.1
          npm ci
          npm ci --prefix web-ui
          npm ci --prefix desktop
          npm --prefix desktop exec -- install-electron
          npm run test:release-policy
          npm run build
          npm --prefix desktop run typecheck
          npm --prefix desktop test
      - name: Prepare temporary signing keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.DESKTOP_MAC_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_MAC_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.DESKTOP_MAC_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ vars.DESKTOP_MAC_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ vars.DESKTOP_MAC_NOTARY_ISSUER }}
        run: |
          umask 077
          : "${CERTIFICATE_BASE64:?Missing signing certificate}"
          : "${CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${NOTARY_KEY_BASE64:?Missing notarization key}"
          : "${NOTARY_KEY_ID:?Missing notarization key ID}"
          : "${NOTARY_ISSUER:?Missing notarization issuer}"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const [name, variable] of [['quarterdeck-certificate.p12', 'CERTIFICATE_BASE64'], ['quarterdeck-notary.p8', 'NOTARY_KEY_BASE64']]) {
            const encoded = process.env[variable];
            if (!encoded || encoded.length % 4 !== 0 || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
              throw new Error(`Invalid base64 signing secret: ${variable}; use a single unwrapped base64 value.`);
            }
            writeFileSync(join(process.env.QUARTERDECK_DESKTOP_SIGNING_DIR, name), Buffer.from(encoded, 'base64'), { mode: 0o600, flag: 'wx' });
          }
          NODE
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"
          security import "$QUARTERDECK_DESKTOP_SIGNING_DIR/quarterdeck-certificate.p12" -k "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN"
          xcrun notarytool store-credentials "$QUARTERDECK_DESKTOP_NOTARY_PROFILE" --keychain "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" --key "$QUARTERDECK_DESKTOP_SIGNING_DIR/quarterdeck-notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          # Only the temporary keychain is needed after successful import.
          rm -f "$QUARTERDECK_DESKTOP_SIGNING_DIR/quarterdeck-certificate.p12" "$QUARTERDECK_DESKTOP_SIGNING_DIR/quarterdeck-notary.p8"
          unset keychain_password
      - name: Sign and notarize application
        env:
          QUARTERDECK_DESKTOP_SIGN: "1"
          QUARTERDECK_DESKTOP_NOTARIZE: "1"
          QUARTERDECK_DESKTOP_SIGNING_IDENTITY: ${{ vars.DESKTOP_MAC_SIGNING_IDENTITY }}
          QUARTERDECK_DESKTOP_TEAM_ID: ${{ vars.DESKTOP_MAC_TEAM_ID }}
        run: |
          : "${QUARTERDECK_DESKTOP_SIGNING_IDENTITY:?Missing Developer ID Application identity}"
          npm --prefix desktop run make -- --arch="$TARGET_ARCH"
          app="desktop/out/Quarterdeck-darwin-$TARGET_ARCH/Quarterdeck.app"
          npm --prefix desktop run verify -- --manifest "$PWD/desktop/out/artifact-manifest-darwin-$TARGET_ARCH.json"
          codesign --verify --deep --strict "$app"
          # Extra resources are executable code too; verify each helper/addon.
          while IFS= read -r -d '' executable; do
            description=$(file -b "$executable")
            if [[ "$description" == *Mach-O* ]]; then codesign --verify --strict "$executable"; fi
          done < <(find "$app/Contents/Resources/runtime" -type f -print0)
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"
      - name: Finalize notarized install and archive containers
        env:
          SIGNING_IDENTITY: ${{ vars.DESKTOP_MAC_SIGNING_IDENTITY }}
        run: |
          version=$(node -p "require('./package.json').version")
          app="desktop/out/Quarterdeck-darwin-$TARGET_ARCH/Quarterdeck.app"
          payload=desktop/out/release
          mkdir -p "$payload"
          # The DMG is installed by npm; the ZIP remains an ancillary CI/archive asset.
          dmg=$(find desktop/out/make -name '*.dmg' -type f)
          [[ -n "$dmg" && "$dmg" != *$'\n'* ]] || { echo "Expected exactly one DMG"; exit 1; }
          final_dmg="$payload/Quarterdeck-$version-darwin-$TARGET_ARCH.dmg"
          cp "$dmg" "$final_dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" --keychain "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" "$final_dmg"
          xcrun notarytool submit "$final_dmg" --keychain "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" --keychain-profile "$QUARTERDECK_DESKTOP_NOTARY_PROFILE" --wait --output-format json > "$RUNNER_TEMP/quarterdeck-dmg-notary.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'quarterdeck-dmg-notary.json'), 'utf8'));
          if (result.status !== 'Accepted') throw new Error(`DMG notarization rejected: ${result.status}`);
          NODE
          xcrun stapler staple "$final_dmg"
          xcrun stapler validate "$final_dmg"
          codesign --verify --strict "$final_dmg"
          hdiutil verify "$final_dmg"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$payload/Quarterdeck-$version-darwin-$TARGET_ARCH.zip"
          node .github/scripts/desktop-release-artifacts.mjs finalize --dir "$payload" --arch "$TARGET_ARCH" --sha "$SOURCE_SHA"
      - name: Remove signing materials
        if: always()
        run: |
          # A keychain deletion error must not skip removal of the P12/P8 files.
          status=0
          if [[ -n "${QUARTERDECK_DESKTOP_SIGNING_DIR:-}" ]]; then
            if [[ -f "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" ]]; then
              security delete-keychain "$QUARTERDECK_DESKTOP_SIGNING_KEYCHAIN" || status=1
            fi
            rm -rf -- "$QUARTERDECK_DESKTOP_SIGNING_DIR" || status=1
          fi
          exit "$status"
      - name: Upload verified signed candidate (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: desktop-signed-${{ matrix.arch }}
          overwrite: true
          path: desktop/out/release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
