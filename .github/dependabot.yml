version: 2
updates:
  - package-ecosystem: npm
    # Shared runtime schemas are imported by web-ui; update both lockfiles in one PR.
    directories:
      - "/"
      - "/web-ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      shared-contracts:
        patterns:
          - "zod"
          - "@trpc/*"
        update-types:
          - minor
          - patch
      claude-agent-sdk:
        patterns:
          - "@anthropic-ai/claude-agent-sdk"
      minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Keep development types aligned with the minimum supported Node 22 runtime line.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
